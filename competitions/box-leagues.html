<!DOCTYPE html>
<html>
<head>
    <title>Squash Box Leagues</title>
    <link rel="stylesheet" href="/squash/css/style.css">
</head>
<body>
    <div class="sidebar"></div>
    <div class="content">
        <h1>Squash Box Leagues</h1>
        <p>Use the tabs at the bottom of the sheet below to view standings and data from previous years.</p>
        <script>
            window.addEventListener('message', function(event) {
                if (event.data && typeof event.data === 'string' && event.data.includes('leesquash.github.io')) {
                    window.location.href = event.data;
                }
            });
            const iframe = document.querySelector('iframe');
            if (iframe) {
                iframe.addEventListener('load', function() {
                    try {
                        const iframeWindow = iframe.contentWindow;
                        iframeWindow.addEventListener('click', function(e) {
                            const target = e.target.closest('a');
                            if (target && target.href.includes('leesquash.github.io')) {
                                e.preventDefault();
                                window.top.location.href = target.href;
                            }
                        }, true);
                    } catch (err) {
                        console.log("Cross-origin restrictions apply, trying message listener.");
                    }
                });
            }
        </script>
        <div class="sheet-container">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTd_IPhz_47MGCFZLDu1Kcl_zAxsdpBT4RM_bGCoIs4PX2oC1N1qpMB11niihso5RI4oIu96hUEASzw/pubhtml?widget=true&amp;headers=false"></iframe>
        </div>
    </div>
    <script>
        fetch('/squash/components/sidebar.html')
            .then(response => response.text())
            .then(data => {
                const sidebar = document.querySelector('.sidebar');
                sidebar.innerHTML = data;
                const scripts = sidebar.getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    eval(scripts[i].innerText);
                }
            });
    </script>
</body>
</html>
