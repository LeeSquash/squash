<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Preview</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 30px;
            background: #0d1020;
            color: #f4f2ed;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }
        .achievement-list {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        .achievement-item {
            background: #151827;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }
        .message {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            color: #aaa;
            font-size: 18px;
            line-height: 1.5;
        }
        .error {
            color: #ff8f8f;
            background: #2a1518;
            border: 1px solid #8f3030;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>Achievement Preview</h1>
    <div class="subtitle">Live trophy artwork from achievementbadge.js</div>

    <div id="achievements" class="achievement-list"></div>
    <div id="message" class="message">Loading...</div>

    <script type="module">
        import { renderAchievementBadge } from "./components/achievementbadge.js";

        const playerName = new URLSearchParams(window.location.search).get("player");
        const container = document.getElementById("achievements");
        const message = document.getElementById("message");

        function showError(text) {
            message.className = "message error";
            message.textContent = text;
        }

        async function loadPreview() {
            try {
                message.textContent = "Loading profiles.json...";

                const response = await fetch("../data/profiles.json");

                if (!response.ok) {
                    throw new Error(
                        `profiles.json returned HTTP ${response.status}`
                    );
                }

                const profiles = await response.json();

                message.textContent = "Finding player...";

                const key = playerName
                    ? playerName.toLowerCase()
                    : Object.keys(profiles)[0];

                const profile = profiles[key];

                if (!profile) {
                    showError(
                        `Player not found.\n\n` +
                        `Requested: ${playerName}\n` +
                        `Key used: ${key}`
                    );
                    return;
                }

                document.querySelector("h1").textContent =
                    `${profile.name} — Achievement Preview`;

                const achievements =
                    profile.achievements?.achievements || [];

                if (achievements.length === 0) {
                    message.textContent =
                        `${profile.name} has no achievements.`;
                    return;
                }

                message.textContent =
                    `Found ${achievements.length} achievements. Rendering trophies...`;

                container.innerHTML = achievements.map(achievement => `
                    <div class="achievement-item">
                        ${renderAchievementBadge(achievement)}
                    </div>
                `).join("");

                message.textContent =
                    `${achievements.length} trophies rendered successfully.`;

            } catch (error) {
                console.error("Achievement preview error:", error);

                showError(
                    `PREVIEW ERROR\n\n` +
                    `${error.message}\n\n` +
                    `Check the browser console (F12) for more details.`
                );
            }
        }

        loadPreview();
    </script>

</body>
</html>
